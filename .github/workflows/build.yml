name: Build CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version=$(python -c 'import repopath; print(repopath.__version__)')
          label="v$version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "发布标签必须符合 v<major>.<minor>.<patch>：$tag" >&2
              exit 1
            fi
            version="${tag#v}"
            label="$tag"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            executable: repopath.exe
            checksum: repopath.exe.sha256
          - platform: linux-x64
            os: ubuntu-latest
            executable: repopath
            checksum: repopath.sha256
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Nuitka
        run: python -m pip install "Nuitka==4.2"

      - name: Inject tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python -c 'from pathlib import Path; import os, re; p=Path("repopath/__init__.py"); s=p.read_text(encoding="utf-8"); s,n=re.subn(r"(__version__\s*=\s*\")[^\"]+(\")", lambda m: m.group(1)+os.environ["RELEASE_VERSION"]+m.group(2), s); assert n == 1; p.write_text(s, encoding="utf-8")'

      - name: Build Windows executable
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: >-
          python -m nuitka --standalone --onefile
          --assume-yes-for-downloads
          --output-dir=build
          --output-filename=repopath.exe
          repopath.py

      - name: Build Linux executable
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: >-
          python -m nuitka --standalone --onefile
          --assume-yes-for-downloads
          --output-dir=build
          --output-filename=repopath
          repopath.py

      - name: Smoke test Windows executable
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          .\build\repopath.exe --help
          $smokeRoot = Join-Path $env:RUNNER_TEMP "repopath-smoke"
          Copy-Item tests/fixtures/mixed_repo $smokeRoot -Recurse -Force
          .\build\repopath.exe $smokeRoot -o "$smokeRoot/report.md"
          if (-not (Test-Path "$smokeRoot/report.md")) {
            throw "exe 未生成分析报告"
          }

      - name: Smoke test Linux executable
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          ./build/repopath --help
          smoke_root="$RUNNER_TEMP/repopath-smoke"
          rm -rf "$smoke_root"
          cp -R tests/fixtures/mixed_repo "$smoke_root"
          ./build/repopath "$smoke_root" -o "$smoke_root/report.md"
          test -f "$smoke_root/report.md"

      - name: Check relocated executable file scanning
        run: >-
          python -S scripts/check_file_scan.py
          --artifact "build/${{ matrix.executable }}"
          --work-dir "${{ runner.temp }}/repopath-file-scan"

      - name: Create Windows checksum
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/repopath.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  repopath.exe" | Set-Content build/repopath.exe.sha256 -Encoding ascii

      - name: Create Linux checksum
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: sha256sum build/repopath > build/repopath.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: repopath-${{ matrix.platform }}-${{ needs.resolve-version.outputs.label }}
          path: |
            build/${{ matrix.executable }}
            build/${{ matrix.checksum }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - resolve-version
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Prepare release assets
        shell: bash
        env:
          VERSION_LABEL: ${{ needs.resolve-version.outputs.label }}
        run: |
          mkdir -p release-assets
          windows_exe=$(find release -type f -name repopath.exe -print -quit)
          linux_exe=$(find release -type f -name repopath -print -quit)
          cp "$windows_exe" "release-assets/repopath-windows-x64-$VERSION_LABEL.exe"
          cp "$linux_exe" "release-assets/repopath-linux-x64-$VERSION_LABEL"
          sha256sum release-assets/* > release-assets/SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
