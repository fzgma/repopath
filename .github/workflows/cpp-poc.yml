name: C++ Semantic POC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-poc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  base-cli:
    name: Base CLI without site-packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check default backend and explicit missing-library failure
        run: python scripts/check_cpp_semantics.py --mode basic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-base-${{ matrix.os }}
          path: build/cpp-smoke/
          if-no-files-found: ignore

  semantic-tests:
    name: libclang (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      REPOPATH_REQUIRE_LIBCLANG: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install semantic test dependencies
        run: >-
          python -m pip install --only-binary=:all: pytest -r requirements-cpp.txt
      - name: Run compilation and semantic tests (missing backend is a failure)
        run: >-
          python -m pytest -q tests/test_cpp_compilation.py tests/test_cpp_semantics.py
          tests/test_cpp_options.py tests/test_cpp_reporting.py tests/test_cpp_packaging.py
          tests/test_cpp_package_preparation.py
      - name: Check real CLI, cross-TU USRs and overload resolution
        run: python scripts/check_cpp_semantics.py --mode source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-semantics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: build/cpp-smoke/
          if-no-files-found: ignore

  package-smoke:
    name: Nuitka standalone and onefile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            executable: repopath.exe
          - os: ubuntu-22.04
            executable: repopath
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned packaging dependencies
        run: python -m pip install Nuitka==4.2 -r requirements-cpp.txt
      - name: Extract pinned official Windows runtime without installing
        if: runner.os == 'Windows'
        run: python scripts/prepare_windows_runtime.py
      - name: Collect Windows licenses and app-local runtime libraries
        if: runner.os == 'Windows'
        run: >-
          python scripts/prepare_cpp_package.py
          --runtime-dir build/windows-runtime-source/x64
      - name: Collect Linux licenses and native packaging configuration
        if: runner.os == 'Linux'
        run: python scripts/prepare_cpp_package.py
      - name: Build standalone CLI with libclang
        run: >-
          python -m nuitka --mode=standalone --assume-yes-for-downloads
          --include-module=clang.cindex
          --user-package-configuration-file=repopath.nuitka-package.config.yml
          --user-package-configuration-file=build/cpp-runtime.nuitka-package.config.yml
          --include-data-dir=build/cpp-package-data=licenses
          --report=build/cpp-standalone-report.xml
          --output-dir=build/cpp-standalone
          --output-filename=${{ matrix.executable }} repopath.py
      - name: Check standalone dependencies and relocated semantic execution
        run: >-
          python scripts/check_cpp_semantics.py --mode standalone
          --artifact build/cpp-standalone/repopath.dist/${{ matrix.executable }}
          --hide-installed-library
      - name: Build onefile CLI with libclang
        run: >-
          python -m nuitka --mode=onefile --assume-yes-for-downloads
          --include-module=clang.cindex
          --user-package-configuration-file=repopath.nuitka-package.config.yml
          --user-package-configuration-file=build/cpp-runtime.nuitka-package.config.yml
          --include-data-dir=build/cpp-package-data=licenses
          --report=build/cpp-onefile-report.xml
          --output-dir=build/cpp-onefile
          --output-filename=${{ matrix.executable }} repopath.py
      - name: Check onefile payload dependencies and relocated semantic execution
        run: >-
          python scripts/check_cpp_semantics.py --mode onefile
          --artifact build/cpp-onefile/${{ matrix.executable }}
          --hide-installed-library
      - name: Upload downloadable PoC executable and license
        uses: actions/upload-artifact@v4
        with:
          name: repopath-cpp-poc-${{ matrix.os }}
          path: |
            build/cpp-onefile/${{ matrix.executable }}
            build/cpp-package-data/
          if-no-files-found: error
      - name: Upload packaging evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-packaging-${{ matrix.os }}
          path: |
            build/cpp-smoke/**/semantic.json
            build/cpp-smoke/**/*.stdout.txt
            build/cpp-smoke/**/*.stderr.txt
            build/cpp-smoke/**/native-dependencies.json
            build/cpp-*-report.xml
            build/cpp-package-data/
            build/windows-runtime-source/provenance.json
          if-no-files-found: ignore
